# The repository runs its own product against its own pull requests.
# Every visitor sees live receipts before they read a line of the README.
name: provene

on:
  pull_request:
  push:
    branches: [main]

# A composite action cannot grant permissions; the calling workflow must.
permissions:
  contents: read
  id-token: write        # mint the OIDC token Sigstore signs against
  attestations: write    # store the signed attestation

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The action diffs against the pull request base, which is not in a
          # shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and build
        run: |
          npm --prefix packages/cli install
          npm --prefix packages/cli run typecheck
          npm --prefix packages/cli run build

      - name: Test with coverage
        working-directory: packages/cli
        run: |
          mkdir -p coverage
          node --test --experimental-test-coverage \
               --test-reporter=lcov --test-reporter-destination=coverage/lcov.info \
               --test-reporter=spec --test-reporter-destination=stdout \
               'test/*.test.ts'

      - name: Conformance suite
        run: python3 spec/conformance/runner/run.py

      # The schema existed from day one and nothing checked emitter output
      # against it, so two defects shipped that the schema itself forbade.
      - name: Emitted receipts satisfy the schema
        run: |
          python3 -m pip install --quiet jsonschema
          node packages/cli/scripts/emit-samples.ts "$RUNNER_TEMP/samples"
          python3 spec/conformance/runner/validate_receipts.py "$RUNNER_TEMP/samples" spec/examples

      - name: Provene
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          coverage: packages/cli/coverage/lcov.info
          # The repository signs its own pull requests, so every visitor sees a
          # real T2 attestation before reading a line of the README.
          #
          # Conditional on visibility because GitHub's attestation store is
          # free for public repositories and a paid feature for private ones.
          # Asking for signing where the platform will refuse it turns every
          # pull request red for a reason that has nothing to do with the code.
          sign: ${{ !github.event.repository.private }}

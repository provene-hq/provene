name: Provene
description: >-
  Verify evidence receipts on a pull request and annotate the changed lines that
  no test executed.
author: provene-hq
branding:
  icon: file-text
  color: gray-dark

inputs:
  version:
    description: >-
      Version of the provene CLI to install. Pinned by default: `latest` would
      mean every consumer's CI executes whatever was published most recently,
      so one compromised npm publish reaches every pipeline using this action --
      in a supply-chain provenance tool. Override deliberately if you want to
      track releases.
    required: false
    default: "0.0.8"
  base:
    description: >-
      Commit to diff against. Defaults to the pull request's base, which is what
      a reviewer is actually comparing.
    required: false
    default: ""
  coverage:
    description: >-
      Path to an lcov report. Without it the action can verify receipts but
      cannot establish which changed lines a test executed, and says so rather
      than implying coverage it does not have.
    required: false
    default: ""
  fail-on-invalid-receipt:
    description: >-
      Fail the check when a receipt is malformed. A forgeable receipt is worse
      than no receipt, so this defaults to true.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install provene
      shell: bash
      run: npm install -g proveneio@${{ inputs.version }}

    - name: Ensure the base commit is present
      shell: bash
      env:
        PROVENE_BASE: ${{ inputs.base != '' && inputs.base || github.event.pull_request.base.sha }}
      run: |
        # actions/checkout defaults to fetch-depth 1, so the pull request base
        # is usually absent and `git rev-parse` on it fails. Fetch just that
        # commit rather than requiring every consumer to set fetch-depth: 0.
        if [ -n "${PROVENE_BASE:-}" ] && ! git rev-parse --verify --quiet "$PROVENE_BASE^{commit}" >/dev/null; then
          echo "base $PROVENE_BASE not present in this clone; fetching it"
          git fetch --no-tags --depth=1 origin "$PROVENE_BASE" ||             echo "provene: could not fetch the base commit; check will report what it can"
        fi

    - name: Check receipts and evidence
      shell: bash
      env:
        PROVENE_BASE: ${{ inputs.base != '' && inputs.base || github.event.pull_request.base.sha }}
        PROVENE_COVERAGE: ${{ inputs.coverage }}
        PROVENE_STRICT: ${{ inputs.fail-on-invalid-receipt }}
      run: |
        set -uo pipefail
        args=(check --annotate github)
        [ -n "${PROVENE_BASE:-}" ] && args+=(--base "$PROVENE_BASE")
        [ -n "${PROVENE_COVERAGE:-}" ] && args+=(--coverage "$PROVENE_COVERAGE")

        provene "${args[@]}" | tee "$RUNNER_TEMP/provene.txt"
        status=${PIPESTATUS[0]}

        {
          echo "## Provene"
          echo
          echo '```'
          cat "$RUNNER_TEMP/provene.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$status" -ne 0 ] && [ "$PROVENE_STRICT" != "true" ]; then
          echo "provene: receipt problems found, not failing the check (fail-on-invalid-receipt=false)"
          exit 0
        fi
        exit "$status"
